<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bake Your Cake | Admin Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="badge">Admin Login</div>
    <h1>Admin Access</h1>
    <p>Sign in to manage orders and registrations.</p>
  </header>

  <main>
    <section class="panel fade" style="max-width: 560px; margin: 0 auto;">
      <h3>Admin Login</h3>
      <form id="admin-login-form">
        <input type="text" id="admin-username" placeholder="Username" required />
        <input type="password" id="admin-password" placeholder="Password" required />
        <button class="primary" type="submit">Enter Admin Panel</button>
      </form>
      <p id="admin-login-message" class="notice"></p>
    </section>
  </main>

  <script src="admin-login.js"></script>
</body>
</html>
