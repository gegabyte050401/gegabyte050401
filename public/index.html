<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bake Your Cake | Online Orders</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <nav class="top-nav">
      <a href="/client-login">Client Login</a>
      <a href="/admin-login">Admin Login</a>
    </nav>
    <h1>Bake Your Cake</h1>
    <p>Freshly baked every morning. Order online for pickup or delivery.</p>
  </header>

  <main class="layout">
    <section>
      <h2>Menu</h2>
      <div id="products" class="grid"></div>
    </section>

    <aside class="cart">
      <h2>Your Order</h2>
      <ul id="cart-items"></ul>
      <p class="total">Total: <span id="total">$0.00</span></p>

      <h3>Checkout</h3>
      <form id="order-form">
        <input type="text" id="customerName" placeholder="Full name" required />
        <input type="tel" id="phone" placeholder="Phone number" required />
        <textarea id="address" rows="3" placeholder="Delivery address" required></textarea>
        <button type="submit">Place Order</button>
      </form>
      <p id="message"></p>

      <hr />
      <h3>Recent Orders</h3>
      <ul id="recent-orders" class="recent-orders"></ul>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
